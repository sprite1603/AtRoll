    if (!input.value.trim()){ msg.className = 'msg ng'; msg.textContent = '認証キーを入力してください'; return; }
    form.querySelector('button').disabled = true;
    const ok = (await keyCheck(input.value)) === CONFIG.twofa.ok;
    store.set(TKEY, ok ? 'ok' : 'ng');
    show2FAResult(ok, s, true);
  });
}
function show2FAResult(ok, s, fresh){
  showScan(`<div class="unlocked ${fresh ? 'fresh' : ''} ${ok ? '' : 'failed'}">
      <div class="seal">${ok ? UNLOCK_SVG : LOCK_SVG}</div>
      <span class="eyebrow">${ok ? 'RESTORATION COMPLETE' : 'RESTORATION FAILED'}</span>
      <h2>${ok ? '復元成功' : '復元失敗'}</h2>
      <p class="body cond">${ok ? '復元成功、ゲームクリアです' : '復元に失敗しました'}</p>
    </div>
    <button class="primary" id="tfClose" type="button">閉じる</button>`);
  const btn = document.getElementById('tfClose'); btn.focus();
  btn.onclick = () => {
    closeScan();
    if (ok && play.step === s){
      play.step = s + 1; play.notes.push({ step:s, text:'復元成功、ゲームクリアです' }); play.pending = false;
      store.set(PKEY, play); renderPlay(true);
    }
  };
}

// 管理者だけが見られるクリア条件
function showCondition(){
  showScan(`<div class="top"><span class="eyebrow">ADMIN ONLY</span></div>
    <p class="body cond">クリア条件：全てのキューブの正解を入力すること</p>
    <button class="primary" id="condClose" type="button">閉じる</button>`);
  document.getElementById('condClose').onclick = closeScan;
  document.getElementById('condClose').focus();
}
function closeScan(){
  stopCamera();
  document.getElementById('scanModal')?.remove();
  if (!document.getElementById('modal')) document.body.style.overflow = '';
}

// ===== 回答画面 =====
function renderPlay(flash){
  const n = CONFIG.steps.length, s = play.step, last = play.notes[play.notes.length - 1];
  const bars = CONFIG.steps.map((_, i) => `<i class="${i + 1 < s ? 'done' : i + 1 === s ? 'now' : ''}"></i>`).join('');
  const done = n > 0 && s > n;
  const past = play.notes.slice(0, done ? -1 : -1);
  root.innerHTML = `<div class="panel">
    ${n ? `<div class="steps" aria-hidden="true">${bars}</div>` : ''}
    ${!n ? '<p class="empty">まだSTEPが登録されていません。</p>' : done
      ? `<div class="clear ${flash ? 'flash' : ''}"><span class="eyebrow">ALL STEPS CLEARED</span><h1>CLEAR</h1></div>
         ${last ? `<div class="note"><span class="eyebrow">MESSAGE</span><p>${esc(last.text)}</p></div>` : ''}`
      : `<div class="label ${flash ? 'flash' : ''}"><small>CURRENT</small><h1>STEP${s}</h1></div>
         <form class="answer" id="form" novalidate>
           ${fieldsOf(CONFIG.steps[s - 1]).length
             ? fieldsOf(CONFIG.steps[s - 1]).map((f, k) => `<label class="fld"><span>${esc(f)}</span><input class="ans" id="${k ? 'answer-' + k : 'answer'}" type="text" autocomplete="off" placeholder="ひらがなで入力" aria-label="STEP${s}の解答${esc(f)}"></label>`).join('')
             : `<input class="ans" id="answer" type="text" autocomplete="off" placeholder="ひらがなで入力" aria-label="STEP${s}の解答">`}
           <button class="primary" type="submit">判定する</button>
         </form>
         <p class="msg" id="msg" aria-live="polite"></p>`}
    ${!done && n && s === CONFIG.lock?.step ? (role
      ? `<button class="lockbtn ${unlocked ? 'opened' : ''}" id="lockBtn" type="button">${LOCK_SVG}${unlocked ? '厳重ロック 解除済み' : '厳重ロック解除'}</button>`
      : `<button class="scan" id="scanBtn" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8V5a1 1 0 0 1 1-1h3M16 4h3a1 1 0 0 1 1 1v3M20 16v3a1 1 0 0 1-1 1h-3M8 20H5a1 1 0 0 1-1-1v-3M8 8h3v3H8zM13 8h3v3h-3zM8 13h3v3H8zM14 14h2v2h-2z"/></svg>ログイン</button>`) : ''}
    ${role === 'adn' ? '<button class="sub condbtn" id="condBtn" type="button">クリア条件</button>' : ''}
    <input type="file" id="qrfile" accept="image/*" capture="environment" hidden>
    <div class="row" id="resetRow">${s > 1 ? '<button class="sub" id="reset" type="button">最初からやり直す</button>' : ''}${canEdit ? '<button class="sub" id="toAdmin" type="button">管理画面</button>' : ''}</div>
  </div>`;
  const form = document.getElementById('form');
  if (form){
    const inputs = [...form.querySelectorAll('input.ans')], msg = document.getElementById('msg');
    const labels = fieldsOf(CONFIG.steps[s - 1]);
    const show = (t, x) => { msg.className = 'msg ' + t; msg.textContent = x; };
    form.addEventListener('submit', async e => {
      e.preventDefault();
      const vals = inputs.map(x => norm(x.value));
      for (let k = 0; k < vals.length; k++){
        const name = labels.length ? `${labels[k]}の` : '';
        if (!vals[k]){ inputs[k].focus(); return show('ng', `${name}解答を入力してください`); }
        if (!isKana(vals[k])){ inputs[k].focus(); return show('ng', `${name}解答はひらがなで入力してください`); }
      }
      const v = vals.join('|'), input = inputs[0];
      form.querySelector('button').disabled = true;
      const text = await tryOpen(CONFIG.salt, s, CONFIG.steps[s - 1], v);
      form.querySelector('button').disabled = false;
      if (text === null){
        show('ng', '不正解です');
        form.classList.remove('shake'); void form.offsetWidth; form.classList.add('shake');
        input.select(); return;
      }
      // 管理者が正解を入れたときは、先に2段階認証を求める
      if (role === 'adn' && CONFIG.twofa && s === CONFIG.twofa.step){ show('', ''); return show2FA(s); }
      play.step = s + 1;
      if (text){ play.notes.push({ step:s, text }); play.pending = true; }
      store.set(PKEY, play);
      renderPlay(true);
      if (play.pending) showModal(); else document.getElementById('answer')?.focus();
    });
  }
  const reset = document.getElementById('reset');
  if (reset) reset.onclick = () => {
    document.getElementById('resetRow').innerHTML = '最初に戻しますか？ <button class="sub" id="yes" type="button">戻す</button><button class="sub" id="no" type="button">やめる</button>';
    document.getElementById('yes').onclick = () => { play = { step:1, notes:[] }; store.set(PKEY, play); role = null; store.set(RKEY, null); unlocked = false; store.set(LKEY, false); store.set(TKEY, null); renderBadge(); renderPlay(); };
    document.getElementById('no').onclick = () => renderPlay();
  };
  const ta = document.getElementById('toAdmin'); if (ta) ta.onclick = openAdmin;
  document.getElementById('qrfile').onchange = e => { const f = e.target.files[0]; e.target.value = ''; if (f) scanQR(f); };
  const sb = document.getElementById('scanBtn'); if (sb) sb.onclick = openCamera;
  const cb = document.getElementById('condBtn'); if (cb) cb.onclick = showCondition;
  const lb = document.getElementById('lockBtn'); if (lb) lb.onclick = () => unlocked ? showUnlocked() : askPassword();
}

// ===== QRコード読み取り =====

// カメラ映像から読み取る。カメラが使えない環境では写真で読み取る
let camStream = null, camTimer = null;
function stopCamera(){
  if (camTimer){ clearTimeout(camTimer); camTimer = null; }
  if (camStream){ camStream.getTracks().forEach(t => t.stop()); camStream = null; }
}
function decodeCanvas(c, ctx){
  if (typeof jsQR !== 'function') return null;
  const img = ctx.getImageData(0, 0, c.width, c.height);
  const r = jsQR(img.data, img.width, img.height, { inversionAttempts:'dontInvert' });
  return r ? r.data : null;
}
async function openCamera(){
  if (!navigator.mediaDevices?.getUserMedia){ document.getElementById('qrfile').click(); return; }
  showScan(`<p class="eyebrow" style="text-align:center">QRコードをカメラに映してください</p>
    <div class="cam"><video id="camVideo" playsinline muted></video><div class="frame"></div></div>
    <p class="ask" id="camMsg">カメラを起動しています…</p>
    <div class="row"><label class="sub" for="qrfile" id="camPhoto">写真で読み取る</label><button class="sub" id="camClose" type="button">閉じる</button></div>`);
  const close = () => { stopCamera(); document.getElementById('scanModal')?.remove(); if (!document.getElementById('modal')) document.body.style.overflow = ''; };
  document.getElementById('camClose').onclick = close;
  document.getElementById('camPhoto').addEventListener('click', () => setTimeout(close, 0));
  try {
    camStream = await navigator.mediaDevices.getUserMedia({ video:{ facingMode:{ ideal:'environment' } }, audio:false });
  } catch(e){
    const m = document.getElementById('camMsg');
    if (m) m.textContent = (e && e.name === 'NotAllowedError')
      ? 'カメラの使用が許可されていません。ブラウザの設定でカメラを許可するか、「写真で読み取る」を使ってください。'
      : 'この環境ではカメラを使えません。「写真で読み取る」を使ってください。';
    document.querySelector('#scanModal .cam')?.remove();
    return;
  }
  const v = document.getElementById('camVideo');
  if (!v){ stopCamera(); return; }
  v.srcObject = camStream;
  try { await v.play(); } catch(e){}
  document.getElementById('camMsg').textContent = '読み取っています…';
  const det = ('BarcodeDetector' in window) ? (() => { try { return new BarcodeDetector({ formats:['qr_code'] }); } catch(e){ return null; } })() : null;
  const c = document.createElement('canvas'), ctx = c.getContext('2d', { willReadFrequently:true });
  const tick = async () => {
    if (!camStream) return;
    let text = null;
    if (v.videoWidth){
      const scale = Math.min(1, 800 / Math.max(v.videoWidth, v.videoHeight));
      c.width = Math.round(v.videoWidth * scale); c.height = Math.round(v.videoHeight * scale);
      ctx.drawImage(v, 0, 0, c.width, c.height);
      if (det){ try { const r = await det.detect(c); if (r[0]) text = r[0].rawValue; } catch(e){} }
      if (text === null) text = decodeCanvas(c, ctx);
    }
    if (!camStream) return;
    if (text !== null){ stopCamera(); showResult(text); return; }
    camTimer = setTimeout(tick, 200);
  };
  tick();
}
function showResult(text){
  const act = QR_ACTIONS[text.trim()];
  if (act) return act();
  const isUrl = /^https?:\/\//i.test(text);
  showScan(`<p class="eyebrow" style="text-align:center">読み取った内容</p><p class="body">${esc(text)}</p>
    ${isUrl ? `<a class="openlink" href="${esc(text)}" target="_blank" rel="noopener">このページを開く</a>` : ''}`, true);
}

// カメラで撮った写真（または画像ファイル）からQRコードを探す
async function scanQR(file){
  showScan('<p class="ask">読み取っています…</p>');
  let text = null;
  try {
    const bmp = await createImageBitmap(file);
    const scale = Math.min(1, 1400 / Math.max(bmp.width, bmp.height));
    const c = document.createElement('canvas');
    c.width = Math.round(bmp.width * scale); c.height = Math.round(bmp.height * scale);
    const ctx = c.getContext('2d', { willReadFrequently:true });
    ctx.drawImage(bmp, 0, 0, c.width, c.height);
    if ('BarcodeDetector' in window){
      try { const r = await new BarcodeDetector({ formats:['qr_code'] }).detect(c); if (r[0]) text = r[0].rawValue; } catch(e){}
    }
    if (text === null && typeof jsQR === 'function'){
      const img = ctx.getImageData(0, 0, c.width, c.height);
      const r = jsQR(img.data, img.width, img.height, { inversionAttempts:'attemptBoth' });
      if (r) text = r.data;
    }
  } catch(e){}
  if (text === null) return showScan('<p class="body">QRコードが見つかりませんでした。</p><p class="ask">QRコードが画面の中央に大きく、ピントが合うように撮り直してください。</p>', true);
  showResult(text);
}
function showScan(inner, closable){
  document.getElementById('scanModal')?.remove();
  const el = document.createElement('div');
  el.className = 'modal'; el.id = 'scanModal';
  el.innerHTML = `<div class="card" role="dialog" aria-modal="true" aria-label="QRコードの読み取り">${inner}
    ${closable ? '<div class="row"><button class="sub retry" type="button">もう一度読み取る</button><button class="sub" id="scanClose" type="button">閉じる</button></div>' : ''}</div>`;
  document.body.appendChild(el);
  document.body.style.overflow = 'hidden';
  const close = () => { el.remove(); if (!document.getElementById('modal')) document.body.style.overflow = ''; };
  document.getElementById('scanClose')?.addEventListener('click', close);
  el.querySelector('.retry')?.addEventListener('click', () => { close(); openCamera(); });
  document.getElementById('scanClose')?.focus();
}

// ===== 指示文ポップアップ =====
// 閉じるまで残り、ページを開き直しても未確認なら再表示する
function showModal(again){
  const last = play.notes[play.notes.length - 1]; if (!last) return;
  document.getElementById('modal')?.remove();
  const final = play.step > CONFIG.steps.length;
  const el = document.createElement('div');
  el.className = 'modal'; el.id = 'modal';
  el.innerHTML = `<div class="card" role="dialog" aria-modal="true" aria-labelledby="mtitle">
    <div class="top">${final ? `<span class="eyebrow">STEP${last.step} CLEAR</span><h2 id="mtitle">おめでとうございます</h2>` : `<h2 id="mtitle">STEP${last.step} CLEAR</h2>`}</div>
    <p class="body">${esc(last.text)}</p>
    <p class="ask">${again ? '確認したら閉じてください。' : final ? '内容を確認したら閉じてください。' : '指示どおりに行動が完了したら、下のボタンで閉じてください。'}</p>
    <button class="primary" id="mclose" type="button">${again ? '閉じる' : final ? '確認しました' : '行動が完了したので閉じる'}</button>
  </div>`;
  document.body.appendChild(el);
  document.body.style.overflow = 'hidden';
  const btn = document.getElementById('mclose');
  btn.focus();
  el.addEventListener('keydown', e => { if (e.key === 'Tab'){ e.preventDefault(); btn.focus(); } });
  btn.onclick = () => {
    el.remove(); document.body.style.overflow = '';
    if (play.pending){ play.pending = false; store.set(PKEY, play); }
    document.getElementById('answer')?.focus();
  };
}

// ===== 管理画面 =====
// 各STEPの状態: locked=登録済みだが正解未入力（指示文は暗号化されたまま）, open=編集可
let rows = [];
async function openAdmin(){
  const cache = store.get(AKEY) || {};
  rows = CONFIG.steps.map(e => { const f = fieldsOf(e); return { entry:e, fields:f, answers:f.length ? f.map(() => '') : [''], text:'', open:false }; });
  for (let i = 0; i < rows.length; i++){
    const a = cache[i + 1];
    if (a){
      const t = await tryOpen(CONFIG.salt, i + 1, rows[i].entry, a);
      if (t !== null){ const r = rows[i]; r.answers = r.fields.length ? a.split('|') : [a]; r.text = t; r.open = true; }
    }
  }
  renderAdmin();
}
const joined = r => r.answers.map(norm).join('|');
function renderAdmin(status){
  root.innerHTML = `<div class="panel wide">
    <div class="adminhead"><h1>管理画面</h1><button class="sub" id="back" type="button">回答画面に戻る</button></div>
    <p class="lead">各STEPの正解と、そのSTEPを突破したときに表示する指示文を設定します。最後のSTEPの指示文はクリア画面に表示されます。指示文は正解を知らないと読めない形で保存されるため、登録済みのSTEPを編集するときは先に正解を入力してください。</p>
    ${rows.map((r, i) => `<section class="stepedit" data-i="${i}">
      <header><h2>STEP${i + 1}</h2>
        <div class="row"><span class="state ${r.open ? 'on' : ''}">${r.open ? '編集できます' : '正解を入力すると編集できます'}</span>
        <button class="sub" data-del="${i}" type="button">削除</button></div></header>
      <label>解答欄の名前（複数あるときは「A,B」のようにカンマで区切る・1つなら空欄）<input type="text" id="fld-${i}" value="${esc(r.fields.join(','))}" autocomplete="off" placeholder="例：A,B"></label>
      <div class="ansgrid">${(r.fields.length ? r.fields : ['']).map((f, k) => `<label>${f ? `${esc(f)} の正解（ひらがな）` : '正解（ひらがな）'}<input type="text" id="ans-${i}-${k}" value="${esc(r.answers[k] || '')}" autocomplete="off" placeholder="${r.entry && !r.open ? '登録済みの正解を入力' : '例：はじまり'}"></label>`).join('')}</div>
      <label>突破時の指示文<textarea id="txt-${i}" ${r.open ? '' : 'disabled'} placeholder="${r.open ? (i + 1 === rows.length ? '例：おめでとうございます。受付にこの画面を見せてください。' : `例：STEP${i + 2}へ進むための指示`) : '正解を入力すると表示されます'}">${esc(r.text)}</textarea></label>
    </section>`).join('')}
    <div class="row end"><button class="sub" id="add" type="button">＋ STEPを追加</button></div>
    <p class="msg ${status?.type || ''}" id="amsg" aria-live="polite">${esc(status?.text || '')}</p>
    <div class="row end"><button class="primary" id="save" type="button">保存して公開</button></div>
  </div>`;
  rows.forEach((r, i) => {
    const ti = document.getElementById('txt-' + i);
    document.getElementById('fld-' + i).addEventListener('change', e => {
      const f = parseFields(e.target.value);
      r.fields = f;
      const n = r.fields.length || 1;
      r.answers = Array.from({ length:n }, (_, k) => r.answers[k] || '');
      renderAdmin();
    });
    r.answers.forEach((_, k) => {
      const ai = document.getElementById(`ans-${i}-${k}`);
      ai.addEventListener('input', async () => {
        r.answers[k] = ai.value;
        if (!r.open && r.entry && r.answers.every(x => norm(x))){
          const t = await tryOpen(CONFIG.salt, i + 1, r.entry, joined(r));
          if (t !== null){ r.open = true; r.text = t; renderAdmin(); document.getElementById(`ans-${i}-${k}`)?.focus(); }
        }
      });
    });
    ti.addEventListener('input', () => { r.text = ti.value; });
  });
  root.querySelectorAll('[data-del]').forEach(b => b.onclick = () => { rows.splice(+b.dataset.del, 1); renderAdmin(); });
  document.getElementById('add').onclick = () => { rows.push({ entry:null, fields:[], answers:[''], text:'', open:true }); renderAdmin(); };
  document.getElementById('back').onclick = () => renderPlay();
  document.getElementById('save').onclick = save;
}
async function save(){
  const fail = text => { const m = document.getElementById('amsg'); m.className = 'msg ng'; m.textContent = text; };
  for (let i = 0; i < rows.length; i++){
    const r = rows[i];
    if (!r.open) return fail(`STEP${i + 1} の正解を入力してください（入力するまで保存できません）`);
    for (let k = 0; k < r.answers.length; k++){
      const a = norm(r.answers[k]), name = r.fields.length ? ` ${r.fields[k]}` : '';
      if (!a) return fail(`STEP${i + 1}${name} の正解が空欄です`);
      if (!isKana(a)) return fail(`STEP${i + 1}${name} の正解はひらがなで入力してください`);
    }
  }
  if (!artifactApi) return fail('この画面からは保存できません。ページの編集権限があるアカウントで開いてください。');
  document.getElementById('save').disabled = true;
  const m = document.getElementById('amsg'); m.className = 'msg'; m.textContent = '保存しています…';
  const steps = [], cache = {};
  for (let i = 0; i < rows.length; i++){
    const entry = await seal(CONFIG.salt, i + 1, joined(rows[i]), rows[i].text);
    steps.push(rows[i].fields.length ? { fields: rows[i].fields, ...entry } : entry);
    cache[i + 1] = joined(rows[i]);
  }
  store.set(AKEY, cache);
  const cfg = JSON.stringify({ salt: CONFIG.salt, steps, ...(CONFIG.lock ? { lock: CONFIG.lock } : {}), ...(CONFIG.twofa ? { twofa: CONFIG.twofa } : {}) }).replace(/</g, '\\u003c');
  const reset = document.head.querySelector('style')?.textContent || '';
  const html = '<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>' + reset + '</style></head><body>'
    + '<title>' + document.title + '</title>' + document.querySelector('link[href*="fonts.googleapis"]').outerHTML
    + '<style id="app-style">' + document.getElementById('app-style').textContent + '</style>'
    + '<script src="' + document.getElementById('qrlib').getAttribute('src') + '" id="qrlib"></scr' + 'ipt>'
    + '<script type="application/json" id="config">' + cfg + '</scr' + 'ipt>'
    + '<script id="app">' + document.getElementById('app').textContent + '</scr' + 'ipt>'
    + '</body></html>';
  try {
    await artifactApi.publish(html);
    m.className = 'msg ok'; m.textContent = '保存しました。ページを読み込み直しています…';
  } catch(e){
    document.getElementById('save').disabled = false;
    if (e?.code === 'conflict') fail('他の場所で更新されたため保存できませんでした。最新の内容を読み込み直します。');
    else if (e?.code === 'not_writer' || e?.code === 'not_granted') fail('このアカウントには保存する権限がありません。');
    else if (e?.code === 'rate_limited') fail('保存が続いたため一時的に止まっています。少し待ってから保存してください。');
    else fail('保存できませんでした（' + (e?.code || 'エラー') + '）。もう一度お試しください。');
  }
}

renderPlay();
if (play.pending) showModal();
(async () => {
  try {
    const user = await window.claude?.use?.('user');
    canEdit = (await user?.canEdit()) ?? false;
    if (canEdit){ artifactApi = await window.claude.use('artifact'); renderPlay(); }
  } catch(e){}
})();
})();
</script>
